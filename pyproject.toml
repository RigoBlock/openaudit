[project]
dependencies = [
  "slither-analyzer", # Solidity static analysis
  "solc-select", # Solidity compiler version manager
  "semgrep", # Pattern-based static analysis (Trail of Bits plugins)
  "web3", # On-chain queries during deployment analysis
  "web3-ethereum-defi", # Multi-RPC support and misc DeFi protocol interactions
]
description = "Smart contract audit skill pipeline for Claude Code/OpenAI Codex"
keywords = ["cosmwasm", "slither", "solana", "solidity", "vyper"]
name = "openaudit-skill"
requires-python = ">=3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
exclude = ["deps/"]

[tool.hatch.build.targets.wheel]
packages = ["openaudit"]
