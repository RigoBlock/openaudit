# Check our dependenies can be installed
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm install

      - name: Build sc-auditor MCP server
        run: |
          cd deps/archethect-sc-auditor
          npm install
          npm run build

      - name: Install Solidity compiler
        run: |
          uv run solc-select install 0.8.28
          uv run solc-select use 0.8.28

      - name: Check prerequisites
        run: bash scripts/check-prerequisites.sh

      - name: Run Slither against sample ERC-20
        run: |
          cd contracts
          uv run slither ERC20.sol --config-file foundry.toml || true
          echo "Slither analysis completed"
